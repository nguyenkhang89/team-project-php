<VirtualHost *:80>
    DocumentRoot /var/www/team-project/public
    <Directory /var/www/team-project/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/team-project-error.log
    CustomLog ${APACHE_LOG_DIR}/team-project-access.log combined
</VirtualHost>
